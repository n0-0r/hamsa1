<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Hamsty 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    background: #ffffff;
    min-height: 100vh;
    overflow-x: hidden;
    color: #3d0e1c;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #d4af37, transparent),
      radial-gradient(2px 2px at 60% 70%, #e75480, transparent),
      radial-gradient(1px 1px at 80% 20%, #d4af37, transparent),
      radial-gradient(2px 2px at 10% 80%, #e75480, transparent),
      radial-gradient(1px 1px at 90% 50%, #d4af37, transparent);
    background-size: 250px 250px;
    animation: twinkle 4s infinite alternate;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes twinkle {
    0% { opacity: 0.3; }
    100% { opacity: 0.7; }
  }

  .heart {
    position: fixed;
    top: -50px;
    pointer-events: none;
    z-index: 5;
    animation: fall linear infinite;
    filter: drop-shadow(0 0 6px rgba(231, 84, 128, 0.5));
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0;
    }
  }

  #intro {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    z-index: 100;
    transition: opacity 1s;
    padding: 20px;
    text-align: center;
  }

  #intro h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(3rem, 10vw, 7rem);
    background: linear-gradient(45deg, #b8860b, #d4af37, #ffd700, #b8860b);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shine 3s linear infinite;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  #intro .name {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(3rem, 10vw, 6rem);
    color: #e75480;
    text-shadow: 0 0 25px rgba(231, 84, 128, 0.4);
    margin-bottom: 40px;
    animation: heartbeat 1.5s infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.08); }
    30% { transform: scale(1); }
    45% { transform: scale(1.05); }
  }

  @keyframes shine { to { background-position: 200% center; } }

  .crown-icon {
    font-size: 4rem;
    margin-bottom: 20px;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.6));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .start-btn {
    padding: 15px 50px;
    font-size: 1.2rem;
    font-weight: 600;
    background: linear-gradient(45deg, #d4af37, #ffd700, #b8860b);
    background-size: 200% auto;
    color: #ffffff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.4s;
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
    animation: shine 3s linear infinite;
  }

  .start-btn:hover { transform: scale(1.08) translateY(-3px); }

  #main {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 500px;
    position: relative;
    z-index: 2;
  }

  .card-counter {
    color: #b8860b;
    font-size: 1rem;
    letter-spacing: 4px;
    margin-bottom: 20px;
    text-transform: uppercase;
    font-weight: 700;
  }

  .card-container {
    background: #ffffff;
    border-radius: 20px;
    padding: 15px;
    box-shadow:
      0 0 0 3px #d4af37,
      0 0 0 6px #ffffff,
      0 0 0 8px #e75480,
      0 20px 50px rgba(61, 14, 28, 0.25);
    width: 100%;
  }

  .media-frame {
    width: 100%;
    height: 400px;
    border-radius: 14px;
    overflow: hidden;
    border: 4px solid #d4af37;
    background: #fafafa;
    position: relative;
  }

  .media-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .media-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .card-quote {
    font-size: clamp(1rem, 4vw, 1.3rem);
    line-height: 1.8;
    color: #3d0e1c;
    padding: 20px 15px 10px;
    font-weight: 600;
    text-align: center;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .buttons-container {
    display: flex;
    gap: 15px;
    margin-top: 25px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  .back-btn {
    display: inline-block;
    padding: 13px 35px;
    font-weight: 600;
    font-size: 1.05rem;
    background: linear-gradient(45deg, #b8860b, #d4af37, #b8860b);
    background-size: 200% auto;
    color: #ffffff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
    font-family: 'Poppins', sans-serif;
  }

  .back-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 12px 35px rgba(212, 175, 55, 0.6);
  }

  .back-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .next-btn {
    display: inline-block;
    padding: 13px 45px;
    font-weight: 600;
    font-size: 1.05rem;
    background: linear-gradient(45deg, #e75480, #d4af37, #b8860b);
    background-size: 200% auto;
    color: #ffffff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 25px rgba(231, 84, 128, 0.4);
    animation: shine 3s linear infinite;
    font-family: 'Poppins', sans-serif;
  }

  .next-btn:hover { transform: scale(1.05); }

  #final {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    z-index: 2;
    width: 100%;
    max-width: 800px;
  }

  #typed-text {
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    font-weight: 600;
    line-height: 2.2;
    color: #3d0e1c;
    min-height: 4em;
    max-width: 700px;
  }

  #typed-text .caret {
    display: inline-block;
    width: 3px;
    background: #e75480;
    margin-left: 3px;
    animation: blink 0.8s infinite;
    vertical-align: middle;
    height: 1.1em;
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  #birthday-text {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    background: linear-gradient(45deg, #b8860b, #d4af37, #ffd700, #e75480, #b8860b);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shine 3s linear infinite;
    margin-top: 40px;
    opacity: 0;
    transform: scale(0.7);
    transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.5));
  }

  #birthday-text.show {
    opacity: 1;
    transform: scale(1);
  }

  .signature {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2rem, 7vw, 3.5rem);
    color: #e75480;
    margin-top: 35px;
    opacity: 0;
    transition: opacity 1.5s;
  }

  .signature.show { opacity: 1; }

  .confetti {
    position: fixed;
    width: 10px;
    height: 14px;
    top: -20px;
    z-index: 10;
    pointer-events: none;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  @media (max-width: 500px) {
    .media-frame { height: 320px; }
    .back-btn, .next-btn { padding: 11px 25px; font-size: 0.95rem; }
  }
</style>
</head>
<body>

<div id="intro">
  <div class="crown-icon">👑</div>
  <h1>Happy Birthday</h1>
  <div class="name">Hamsty</div>
  <button class="start-btn" onclick="startExperience()">Open Your Gift 🎁</button>
</div>

<div id="main">
  <div class="card-counter" id="counter">1 / 16</div>
  <div class="card-container">
    <div class="media-frame" id="mediaFrame">
      <img id="cardImage" src="" alt="media">
    </div>
    <div class="card-quote" id="cardQuote"></div>
  </div>
  <div class="buttons-container">
    <button class="back-btn" id="backBtn" onclick="prevCard()">⬅ Back</button>
    <button class="next-btn" id="nextBtn" onclick="nextCard()">Next ✨</button>
  </div>
</div>

<div id="final">
  <div id="typed-text"></div>
  <div id="birthday-text"></div>
  <div class="signature" id="signature">With all my love ♥</div>
</div>

<script>
  const finalMessage = "إلى رفيقة العمر.. في يوم ميلادك لا أبحث عن كلمات كثيرة بل عن كلمات صادقة تليق بقلبك. أدعو الله أن يرزقك الصحة والعافية وراحة البال، وأن يباركك لك عامك الجديد من كل ما بتمناه قلبك. بعض الناس يدخلون حياتنا كأصدقاء، ثم دون أن نشعر يصبحون جزءًا من ذكرياتنا ومن دعائنا ومن الأشياء التي نخاف فقدانها. وأنتِ كنتِ كذلك؛ لست شخصًا أعرفه فحسب، بل شخصًا أخشى أن تؤذيه الحياة، لأن فكرة حزنك وحدها تؤلمني. لكن يبقى في قلبي أمنيات خاصة لكل لحظة جمعتني بك. فلكل ذكرى صنعتها معي، ولكل ضحكة تبادلناها، أحبك في لحظاتي وأكثر مما أستطيع أن أصفه، وأحب أن أراكى في خير وسعادة وهناء. يا رفيقة الفكر والقلب.. كل عام وأنتِ أقرب الناس إلى قلبي، وكل عام وأنتِ سكينة قلبي وأجمل أيامي. يا رب اجعل كل عام وأنتِ بألف خير، وأسعدك مدى الحياة. كل سنة وانتي طيبة يا همستي 💖 عقبال ١٠٠ سنة من الفرح والسعادة 👑✨";

  const birthdayMessage = "Happy Birthday Hamsty 🎂";

  const cards = [
    { type: "image", src: "https://i.ibb.co/LD2G5v5S/photo1-jpg.jpg",
      quote: "ياه على مشاريع عايدة اللي مش بتخلص بس تفوقنا على نفسنا والحمد لله خدنا accepted 😂" },
    { type: "image", src: "https://i.ibb.co/Xx270BPz/photo2-jpg.jpg",
      quote: "أحلى ذكريات هي اللي بتجمعنا مع بعض 💖" },
    { type: "image", src: "https://i.ibb.co/p6WTYZ2H/photo3-jpg.jpg",
      quote: "بنكبر وبنكبر بس ضحكتنا زي ما هي 😄" },
    { type: "image", src: "https://i.ibb.co/WWLCBZPs/photo4-jpg.jpg",
      quote: "الوقت قصير بس الذكريات بتفضل 💫" },
    { type: "image", src: "https://i.ibb.co/Q7PXNrXf/photo5-jpg.jpg",
      quote: "الحلو في الموضوع إن كنا فرحانين سوا 🌸" },
    { type: "image", src: "https://i.ibb.co/1fMS9rSc/photo6-jpg.jpg",
      quote: "كل صورة حكاية، وكل حكاية ذكرى ✨" },
    { type: "image", src: "https://i.ibb.co/xtG6sk2q/photo7-jpg.png",
      quote: "لحظة، ذكرى، وحكاية 💝" },
    { type: "image", src: "https://i.ibb.co/7dW5dWNq/photo8-jpg.jpg",
      quote: "دفا الصحبة 🌸" },
    { type: "image", src: "https://i.ibb.co/jvP6kDb1/photo9-jpg.jpg",
      quote: "بتتصوروا من غيري يا خاينين دا انا هعلقكم 😂😂" },
    { type: "image", src: "https://i.ibb.co/2BLDNZX/photo10-jpg.jpg",
      quote: "اوعا بقا على الحلاوة ايه القمر دا (اول يوم جامعة سنة تانية) 🌙" },
    { type: "image", src: "https://i.ibb.co/7thqVQq2/Whats-App-Image-2026-03-17-at-3-54-22-PM.jpg",
      quote: "الصحاب الحقيقين هما العيلة اللي بنختارها 💖" },
    { type: "video", src: "https://streamable.com/e/ib9il8",
      quote: "المفروض إننا كنا بنحاول نعمل فيديو بس طبعاً فشل فشل ذريع، بس كفاية ضحكتنا فيه 😂" },
    { type: "video", src: "https://streamable.com/e/678q9w",
      quote: "حرفياً احنا مش بنعمل حاجة في الجامعة غير الأكل 😂" },
    { type: "image", src: "https://i.ibb.co/5XvXf8PY/Whats-App-Image-2026-10-05-at-2-08-16-AM-1.jpg",
      quote: "مش عارفة احنا قاعدين كدا ليه بس الصورة عجباني 😄" },
    { type: "image", src: "https://i.ibb.co/vCVRPmjY/Whats-App-Image-2026-09-28-at-9-08-46-PM.jpg",
      quote: "اوعا الشياكة 😎" },
    { type: "image", src: "https://i.ibb.co/x8LdLx4C/Whats-App-Image-2026-09-28-at-9-09-23-PM.jpg",
      quote: "هدنى لازقة فيكي كدا لحد ما تزهقي مني وحتى لو زهقتي مش هسيبك بردو 💖" }
  ];

  let currentIndex = 0;

  const heartEmojis = ['❤️', '💖', '💗', '💕', '💝', '🌸', '✨', '👑'];

  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
    heart.style.animationDuration = (Math.random() * 5 + 6) + 's';
    heart.style.animationDelay = Math.random() * 3 + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 12000);
  }

  setInterval(createHeart, 500);

  const confettiColors = ['#d4af37', '#e75480', '#b8860b', '#ffd700', '#ffb6c1', '#800020'];

  function createConfetti() {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
    c.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }

  function confettiBurst(count = 60) {
    for (let i = 0; i < count; i++) setTimeout(createConfetti, i * 30);
  }

  function startExperience() {
    const intro = document.getElementById('intro');
    intro.style.opacity = '0';
    setTimeout(() => {
      intro.style.display = 'none';
      document.getElementById('main').style.display = 'flex';
      loadCard(0);
    }, 1000);
  }

  function loadCard(index) {
    const mediaFrame = document.getElementById('mediaFrame');
    const quote = document.getElementById('cardQuote');
    const counter = document.getElementById('counter');
    const nextBtn = document.getElementById('nextBtn');
    const backBtn = document.getElementById('backBtn');

    mediaFrame.innerHTML = '';

    const item = cards[index];

    if (item.type === "image") {
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = "media";
      mediaFrame.appendChild(img);
    } else if (item.type === "video") {
      const iframe = document.createElement('iframe');
      iframe.src = item.src;
      iframe.setAttribute('frameborder', '0');
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.setAttribute('allow', 'autoplay; fullscreen');
      mediaFrame.appendChild(iframe);
    }

    quote.textContent = item.quote;
    counter.textContent = `${index + 1} / ${cards.length}`;

    nextBtn.textContent = (index < cards.length - 1)
      ? 'Next ✨'
      : 'One Last Surprise 🎁';

    // تعطيل زرار Back لو إحنا في أول بطاقة
    backBtn.disabled = (index === 0);
  }

  function nextCard() {
    currentIndex++;
    if (currentIndex < cards.length) {
      loadCard(currentIndex);
    } else {
      showFinal();
    }
  }

  function prevCard() {
    if (currentIndex > 0) {
      currentIndex--;
      loadCard(currentIndex);
    }
  }

  function showFinal() {
    document.getElementById('main').style.display = 'none';
    const final = document.getElementById('final');
    final.style.display = 'flex';

    confettiBurst(100);

    setTimeout(() => {
      if (finalMessage && finalMessage.trim() !== "") {
        typeText(finalMessage);
      } else {
        document.getElementById('signature').classList.add('show');
        celebrate();
      }
    }, 1200);
  }

  function typeText(text) {
    const target = document.getElementById('typed-text');
    target.innerHTML = '';
    let i = 0;

    const caret = document.createElement('span');
    caret.className = 'caret';

    const interval = setInterval(() => {
      if (i < text.length) {
        target.innerHTML = text.substring(0, i + 1);
        target.appendChild(caret);
        i++;
        if (i % 5 === 0) createHeart();
      } else {
        clearInterval(interval);
        caret.remove();

        setTimeout(() => {
          document.getElementById('birthday-text').textContent = birthdayMessage;
          document.getElementById('birthday-text').classList.add('show');
          confettiBurst(50);
        }, 500);

        setTimeout(() => document.getElementById('signature').classList.add('show'), 2500);

        setTimeout(celebrate, 2000);
      }
    }, 70);
  }

  function celebrate() {
    for (let i = 0; i < 50; i++) setTimeout(createHeart, i * 70);
    confettiBurst(150);
  }

  window.addEventListener('load', () => {
    for (let i = 0; i < 15; i++) setTimeout(createHeart, i * 200);
  });
</script>

</body>
</html>
